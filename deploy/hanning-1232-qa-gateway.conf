# Only this fixed upstream is exposed. App/worker retain no external network.
pid /tmp/qa-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/qa-client-body;
    proxy_temp_path /tmp/qa-proxy;
    fastcgi_temp_path /tmp/qa-fastcgi;
    uwsgi_temp_path /tmp/qa-uwsgi;
    scgi_temp_path /tmp/qa-scgi;
    server {
        listen 8080;
        client_max_body_size 200m;
        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
